name: Deploy to EC2

on:
  push:
    branches: [aws-bedrock]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd RapidSummarize
            git pull origin aws-bedrock
            docker compose down
            docker system prune -af
            docker compose up -d --build
